<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroIntern · Real Experience, Short Commitments</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --pastel-blue: #A7C7E7;
            --pastel-mint: #BEE7C9;
            --pastel-lavender: #D7C9E8;
            --bg-cream: #FAFAF7;
            --text-dark: #2E2E2E;
            --text-medium: #5F5F5F;
            --white: #FFFFFF;
            --border: #E8E8E5;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-cream);
            color: var(--text-medium);
            line-height: 1.7;
        }

        h1, h2, h3 {
            font-family: 'Sora', sans-serif;
            color: var(--text-dark);
            font-weight: 600;
        }

        /* ========== NAVIGATION ========== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(250,250,247,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Sora', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--pastel-blue), var(--pastel-lavender));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-medium);
            position: relative;
        }

        .nav-links a:hover {
            color: var(--text-dark);
        }

        .nav-cta {
            display: flex;
            gap: 1rem;
        }

        /* ========== BUTTONS ========== */
        .btn {
            padding: 0.8rem 1.8rem;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--pastel-blue);
            color: var(--text-dark);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--pastel-blue);
            color: var(--text-dark);
        }

        /* Placeholder content spacing */
        .placeholder {
            padding-top: 8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav>
        <div class="nav-container">
            <div class="logo">MicroIntern</div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Browse</a></li>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">For Mentors</a></li>
            </ul>

            <div class="nav-cta">
                <button class="btn btn-secondary">Sign In</button>
                <button class="btn btn-primary">Get Started</button>
            </div>
        </div>
    </nav>

    <!-- EMPTY BODY (INTENTIONAL FOR COMMIT 1) -->
    <div class="placeholder">
        <h1>MicroIntern UI Base Setup</h1>
        <p>Design system and navigation initialized.</p>
    </div>

</body>
</html>
